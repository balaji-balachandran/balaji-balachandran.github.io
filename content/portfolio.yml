# Portfolio items.
# Each entry renders as one item in the section.
# `description` supports markdown, inline HTML and $$...$$ math.
# `summary` is a shorter fallback, shown only when there is no description.
items:
  - title: Portfolio item number 1
    description: >-
      This is an item in your portfolio. It can be have images or nice text. If you name the
      file .md, it will be parsed as markdown. If you name the file .html, it will be parsed as
      HTML.
    summary: Short description of portfolio item number 1<br/><img src='/images/500x300.png'>
  - title: Portfolio item number 2
    description: >-
      This is an item in your portfolio. It can be have images or nice text. If you name the
      file .md, it will be parsed as markdown. If you name the file .html, it will be parsed as
      HTML.
    summary: Short description of portfolio item number 2 <br/><img src='/images/500x300.png'>
