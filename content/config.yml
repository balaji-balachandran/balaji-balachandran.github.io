# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Home"
title_separator          : "-"
name                     : &name "Balaji Balachandran"
description              : &description "Computer and network security researcher"
url                      : "https://balaji-balachandran.github.io"
baseurl                  : "" 
repository               : "minimalacademicsite/minimalacademicsite.github.io"

# Search engine metadata. Feeds the <title>, the meta description, the
# link-preview card shown when the site is shared, and the structured data
# (JSON-LD) that search engines read to understand who this page is about.
seo:
  # Shown as the clickable headline in search results. Aim for under ~60
  # characters or Google truncates it.
  title       : "Balaji Balachandran | Computer & Network Security"
  # The grey text under the headline. Under ~155 characters.
  description : >-
    Balaji Balachandran is an MS computer science student at Stanford
    researching computer and network security with the Empirical Security
    Research Group.
  # Image for the link-preview card, from public/images/.
  image       : "balaji_in_amsterdam.jpg"
  # Used in the structured data to describe the person.
  jobTitle    : "Graduate Student Researcher"
  affiliation : "Stanford University"
  alumniOf    : "University of Illinois Urbana-Champaign"
  knowsAbout:
    - Computer security
    - Network security
    - Internet measurement
    - Web privacy

# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing src/components/Sidebar.tsx
# Sidebar "Affiliations" logos. Commented out, so the block is hidden.
# Uncomment and point `logo` at a file in public/images/ to show it.
# affiliations:
#   - name: University of Earth Sciences
#     logo: university-placeholder.png
#     url: https://example.edu
#   - name: Climate Analytics Lab
#     logo: lab-placeholder.png

author:
  # Biographic information
  avatar           : "balaji_in_amsterdam.jpg"
  # Download CV button. One version renders as a plain link; uncomment the
  # second and the button expands on click to offer both. Omit `cv` to hide it.
  cv:
    onepage        : "/files/one-page-resume.pdf"
    full         : "/files/full-cv.pdf"
  name             : "Balaji Balachandran"
  description      : "MSCS @ Stanford"
  pronouns         : ""
  bio              : "Researcher studying security of networked systems"
  location         : "Stanford, CA"
  employer         : "Stanford University"
  uri              : 
  email            : "balajib@stanford.edu" 

  # Academic websites
  academia         : 
  arxiv            : 
  googlescholar    : "CpyhmsAAAAAJ"
  impactstory      : 
  orcid            : "0000-0002-7695-4498"
  semantic         : 
  pubmed           : 
  researchgate     : 
  scopus           : 

  # Repositories and software development
  bitbucket        : 
  codepen          : 
  dribbble         : 
  github           : "balaji-balachandran"
  kaggle           : 
  stackoverflow    : 

  # Social media
  artstation       : 
  bluesky          : 
  facebook         : 
  flickr           : 
  foursquare       : 
  goodreads        : 
  google_plus      : 
  keybase          : 
  instagram        : 
  lastfm           : 
  linkedin         : "balaji-balachandran-dev"
  mastodon         : 
  medium           : 
  pinterest        : 
  soundcloud       : 
  steam            : 
  telegram         : 
  tumblr           : 
  twitter          : 
  vine             : 
  weibo            : 
  wikipedia        : 
  xing             : 
  youtube          : 
  zhihu            : 

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled" 
talkmap_link             : false      
comments:
  provider               : 
  disqus:
    shortname            :
  discourse:
    server               : 
  facebook:
    appid                :
    num_posts            : 
    colorscheme          : 
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" 
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" 
atom_feed:
  hide                   : false     
  path                   : 

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  
og_description           :  
social:
  type                   : 
  name                   : 
  links: 

# Analytics
analytics:
  provider               :  "google-gtag" 
  google:
    tracking_id          : ""

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# These settings control the types of collections used by the template
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC 

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development