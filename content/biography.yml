# Biography section. Paragraphs may contain inline HTML (<strong>, <em>, <a>).
# `note` is the highlighted callout box; `icon` is any Font Awesome class.
heading: Biography
paragraphs:
  - >-
    Hey! I'm a masters student at Stanford University specializing in computer and network security. I 
    serve as research assistant for the <a href="https://esrg.stanford.edu/" target="_blank">Empirical Security Research 
    Group</a>, where I'm advised by <a href="https://zakird.com/" target="_blank">Zakir Durumeric</a> and have been mentored by 
    <a href="https://rumaisahabib.com/" target="_blank">Rumaisa Habib</a> and <a href="https://www.prstephens.com/" target="_blank">
    Phillip Stephens</a>. Recently, I have been interested in <strong> internet measurement</strong> to enable more
    <strong>efficient use of the web</strong>. More broadly, my research interests center around deconstructing our assumptions of 
    networked systems to improve performance and security. Previously, I completed my bachelor's degree in computer science at UIUC with a minor in mathematics and graduated with 
    highest honors.
note:
  icon: fas fa-bullhorn
  text: >-
    I'm applying to PhD programs at the intersection of computer networking and security. Please feel free to <a href="mailto:balajib@stanford.edu">contact me</a> with any relevant opportunities!
