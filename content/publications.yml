items:
  - title: >-
      "Stop Trying to Make Fetch Happen": Towards a Modality-Aware Understanding of Unnecessary Resources on the Web
    authors:
      - Rumaisa Habib
      - Balaji Balachandran
      - Nurullah Demir
      - Zakir Durumeric
    date: "2026-09-29"
    venue: "ACM Internet Measurement Conference 2026"
    category: conferences
    description: >-
      Websites typically deliver the same content to every visitor, treating their audience as a monolith. We challenge this assumption by showing that identifying which parts of a page visitors needs makes it possible to avoid transferring significant amount of data. We measure a naive approach and quantify its effects on page load performance and energy consumption, offering a new perspective on web bloat.
    summary: >-
      Using user-defined modalities to identify potential resource reduction on the web.
    paper: /files/imc26-web-waste.pdf
    doi: "10.1145/3777912.3839788"
    citation: >-
      Rumaisa Habib, Balaji Balachandran, Nurullah Demir, and Zakir Durumeric. 2026.
      "Stop Trying to Make Fetch Happen": Towards a Modality-Aware Understanding of
      Unnecessary Resources on the Web. In Proceedings of the 2026 ACM Internet
      Measurement Conference (IMC '26). Association for Computing Machinery,
      New York, NY, USA, 339–355. https://doi.org/10.1145/3777912.3839788
